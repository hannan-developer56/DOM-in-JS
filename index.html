<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <img id="image" src="./images/image 1.jpeg" alt="">
    <h3 id="productName">
        <i>Wireless HeadPhone</i>
    </h3>
    <p id="description">
        <b>For Noise-Canceling:</b>
        <br>
        Turn down the world and turn up
        <br>
        the music with advanced noise-canceling technology
    </p>
    <h4>
        <b>Price: <i id="price">Rs.6500</i></b>
    </h4>
    <input type="text" id="username" placeholder="Enter your name">
    <h3 id="welcome"></h3>
    <div class="btn">
        <button id="changecontent">Buy Now</button>
        <button id="changeProduct">Change Product</button>
        <button id="welcomeBtn">Welcome</button>
        <button id="productBtn">Update Product</button>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
